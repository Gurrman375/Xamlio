name: Build Xbox app

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  uwp-package:
    # Do not attempt signed packaging for pull requests from forks.
    if: github.event_name != 'pull_request'

    runs-on: windows-2022

    env:
      CERT_PASSWORD: ${{ secrets.PACKAGE_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set package version
        shell: pwsh
        run: |
          $manifest = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src/Xamlio/Package.appxmanifest"

          $version = "1.0.${{ github.run_number }}.0"
          $contents = [System.IO.File]::ReadAllText($manifest)

          if ($contents -notmatch '(?m)^\s*<Identity\b[^>]*/>')
          {
              throw "The manifest does not contain a valid Identity element."
          }

          $identityLine =
              '  <Identity Name="StremioXbox" Publisher="CN=StremioXbox" Version="' +
              $version +
              '" />'

          $contents = [regex]::Replace(
              $contents,
              '(?m)^\s*<Identity\b[^>]*/>',
              $identityLine,
              1
          )

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllText(
              $manifest,
              $contents,
              $utf8NoBom
          )

          "PACKAGE_VERSION=$version" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      - name: Validate package manifest
        shell: pwsh
        run: |
          $manifest = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src/Xamlio/Package.appxmanifest"

          [xml]$xml = [System.IO.File]::ReadAllText($manifest)

          $identity = $xml.SelectSingleNode(
              "/*[local-name()='Package']/*[local-name()='Identity']"
          )

          if ($null -eq $identity)
          {
              throw "Package.appxmanifest still has no Identity element."
          }

          Write-Host "Manifest identity:"
          Write-Host $identity.OuterXml

      - name: Create signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PASSWORD))
          {
              throw "PACKAGE_CERTIFICATE_PASSWORD GitHub secret is missing."
          }

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=StremioXbox" `
            -KeyUsage DigitalSignature `
            -FriendlyName "StremioXbox" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
                "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
                "2.5.29.19={text}"
            )

          $password = ConvertTo-SecureString `
            -String $env:CERT_PASSWORD `
            -Force `
            -AsPlainText

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\StremioXbox.pfx" `
            -Password $password |
            Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\StremioXbox.cer" |
            Out-Null

      - name: Build and package Release x64
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path out |
            Out-Null

          msbuild src/Xamlio/Xamlio.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\StremioXbox.pfx" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - name: Collect install files
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist |
            Out-Null

          Get-ChildItem out -Recurse -Include *.msix,*.appx |
            Where-Object {
              $_.FullName -notmatch '\\(arm|arm64|x86)\\'
            } |
            ForEach-Object {
              Copy-Item $_.FullName dist\
            }

          Copy-Item `
            "$env:RUNNER_TEMP\StremioXbox.cer" `
            dist\

          Get-ChildItem dist |
            Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xamlio-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Publish versioned release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Xamlio $env:PACKAGE_VERSION"
          $tag = "v$env:PACKAGE_VERSION"

          $notes = @"
          ## Download Xamlio

          <a href="https://apps.microsoft.com/detail/9nk0rm6n126h?hl=en-US&gl=US">
            <img src="https://get.microsoft.com/images/en-us%20dark.svg" width="200" />
          </a>

          Or download the signed package files below and install them through Xbox Device Portal:
          1. Select the Xamlio app package.
          2. Add the other .appx files as dependencies.
          3. Install Xamlio.cer if the certificate is requested.

          ## Changelog

          ### Playback and stability

          - Added safer chapter seeking with queued/latest-wins seek handling.
          - Prevented failed MKV seeks from being mistaken for episode completion.
          - Prevented false `EndReached` events after failed chapter seeks from starting the next episode.
          - Added visible seek status and error messages below the loading indicator.
          - Added explicit player teardown when leaving playback, including preload cancellation and LibVLC disposal.
          - Added next-episode stream preparation without creating a second media player or starting playback.
          - Disabled hardware decoding by default for improved Xbox stability.
          - Added memory diagnostics using the UWP app memory report.

          ### Audio and subtitles

          - Added preferred audio language settings.
          - Added preferred subtitle language settings.
          - Added an option to enable preferred subtitles by default.
          - Added optional Signs and Songs subtitle preference.
          - Reduced subtitle loading to the preferred track by default.
          - Added on-demand loading for additional subtitle tracks.
          - Added subtitle track refresh after selection so the current cue appears immediately.
          - Added audio and subtitle diagnostics while switching tracks.

          ### Xbox controls and player interface

          - D-pad left/right now remains available for player UI focus navigation.
          - Bumpers navigate backward and forward by chapter.
          - Chapter Back now targets the previous chapter boundary instead of the current chapter start.
          - Added chapter diagnostics with current and target chapter information.
          - Updated player controls with Segoe MDL2 Assets icons.
          - Updated the audio control to use the globe icon.
          - Added a next-episode button when another episode is available.

          ### Diagnostics and privacy

          - Replaced direct debug output with rotating app log files in the app LocalState folder.
          - Redacted authentication keys and sensitive extension URL data from API diagnostics.
          - API response logs now record status and byte counts instead of full response bodies.
          - Added LibVLC decoder, seek, subtitle, preload, lifecycle, and memory diagnostics.
          - Added memory budget warnings at 80% and critical warnings at 90% of the reported limit.

          ### Build and release improvements

          - GitHub releases now use unique version tags and preserve previous builds.
          - Added Microsoft Store download link and badge to every release.

          Build $env:PACKAGE_VERSION
          Commit: ${{ github.sha }}
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $notes)

          $files = Get-ChildItem dist -File |
            ForEach-Object {
              $_.FullName
            }

          gh release create $tag `
            $files `
            --title $title `
            --notes-file $notesPath `
            --target ${{ github.sha }}
